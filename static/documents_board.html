<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Этапы и документы — НейроМастер</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#eef1f6;--surface:#fff;--surface-2:#f6f8fb;--ink:#15202e;--muted:#586475;--faint:#8b94a3;
  --line:#e3e7ef;--line-2:#d2d9e4;--accent:#2f5fe0;--accent-soft:#e9f0fe;--accent-ink:#1e46bd;
  --ok:#16794a;--warn:#9a6a10;--warn-soft:#f7eed9;--warn-line:#e6d3a3;
  --pdf:#d1493f;--doc:#2f5fe0;--xls:#1f8a54;--ppt:#d1712a;
  --shadow-sm:0 1px 2px rgba(21,32,46,.05);--shadow:0 4px 18px rgba(21,32,46,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1119;--surface:#151d29;--surface-2:#111825;--ink:#e7ecf4;--muted:#9aa5b4;--faint:#697484;
  --line:#232f40;--line-2:#2f3d52;--accent:#6f97f5;--accent-soft:#182640;--accent-ink:#9db8fa;
  --ok:#57c489;--warn:#d6a955;--warn-soft:#2c2410;--warn-line:#4a3d18;
  --pdf:#e5675d;--doc:#6f97f5;--xls:#4bbd80;--ppt:#e0925a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 6px 22px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{max-width:1180px;margin:0 auto;padding:28px 22px 80px}
.top{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:#fff;font-size:18px}
h1{font-size:1.3rem;font-weight:800;margin:0}
.sub{color:var(--muted);font-size:.85rem;margin:1px 0 0}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 13px;font:inherit;font-size:.83rem;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:none}
.btn:hover{color:var(--ink)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 13px;min-width:78px}
.stat b{display:block;font-size:1.15rem;font-weight:800}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat.warn b{color:var(--warn)}
.msg{padding:40px 0;text-align:center;color:var(--muted)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.stage-head{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.stage-n{width:30px;height:30px;flex:none;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.stage-head .tt{font-weight:800;font-size:1.02rem}
.stage-head .dd{color:var(--muted);font-size:.82rem}
.stage-count{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:.3em .6em;border-radius:6px;white-space:nowrap}
.sub-row{display:grid;grid-template-columns:250px 1fr;gap:18px;padding:16px 20px;border-top:1px solid var(--line)}
.sub-row:first-child{border-top:0}
.sub-info .st{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px}
.sub-info .st::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent);flex:none;transform:rotate(45deg)}
.sub-info .cnt{color:var(--faint);font-size:.75rem;margin-top:4px}
.docs{display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start}
.empty{color:var(--faint);font-size:.82rem;font-style:italic;align-self:center}
.doc{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:210px;max-width:270px}
.ext{width:30px;height:30px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:.58rem;font-weight:800}
.ext.pdf{background:var(--pdf)}.ext.docx{background:var(--doc)}.ext.xls{background:var(--xls)}.ext.ppt{background:var(--ppt)}.ext.gen{background:var(--muted)}
.doc .nm{font-weight:600;font-size:.83rem;line-height:1.25;word-break:break-word}
.doc .kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.kw span{font-size:.66rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:.1em .4em}
.score{font-size:.66rem;color:var(--muted);font-weight:700;margin-top:5px}
.stage.unassigned{border-color:var(--warn-line)}
.stage.unassigned .stage-head{background:var(--warn-soft)}
.stage.unassigned .stage-n{background:transparent;color:var(--warn)}
.foot{margin-top:26px;color:var(--faint);font-size:.76rem;text-align:center}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <div class="logo">🧠</div>
      <div><h1>Этапы обучения и документы</h1>
        <p class="sub">Какие документы закреплены за каждым этапом и подэтапом адаптации</p></div>
    </div>
    <div class="actions">
      <a class="btn" href="/admin">← В админку</a>
      <button class="btn" id="reload">Обновить</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="board"><div class="msg">Загрузка…</div></div>
  <div class="foot">Данные из реестра метаданных (таблица documents) · привязка к подэтапам по сходству эмбеддингов (Вариант 1)</div>
</div>

<script>
var EXT={pdf:'pdf',docx:'docx',doc:'docx',xls:'xls',xlsx:'xls',ppt:'ppt',pptx:'ppt'};
var LABEL={pdf:'PDF',docx:'DOCX',doc:'DOCX',xls:'XLSX',xlsx:'XLSX',ppt:'PPTX',pptx:'PPTX'};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function extOf(m){m=(m||'').toLowerCase();return EXT[m]||'gen';}
function labelOf(m){m=(m||'').toLowerCase();return LABEL[m]||(m?m.toUpperCase().slice(0,4):'ФАЙЛ');}
function docCard(d){
  var kw=(d.keywords||[]).slice(0,3).map(function(k){return '<span>'+esc(k)+'</span>';}).join('');
  var sc=(d.score!=null)?'<div class="score">уверенность '+Number(d.score).toFixed(2)+'</div>':'';
  return '<div class="doc"><div class="ext '+extOf(d.mime)+'">'+labelOf(d.mime)+'</div>'+
         '<div><div class="nm">'+esc(d.filename)+'</div>'+(kw?'<div class="kw">'+kw+'</div>':'')+sc+'</div></div>';
}
function render(b){
  var st=b.stats||{};
  document.getElementById('stats').innerHTML=
    stat(st.stages,'этапов')+stat(st.substages,'подэтапов')+stat(st.documents,'документов')+
    stat(st.unassigned,'без привязки',true);
  var html='';
  (b.stages||[]).forEach(function(s,i){
    var rows='';
    (s.substages||[]).forEach(function(sub){
      rows+='<div class="sub-row"><div class="sub-info"><div class="st">'+esc(sub.title)+'</div>'+
            '<div class="cnt">'+(sub.documents.length||0)+' док.</div></div><div class="docs">'+
            (sub.documents.length?sub.documents.map(docCard).join(''):'<div class="empty">— нет документов —</div>')+
            '</div></div>';
    });
    if((s.documents||[]).length){
      rows+='<div class="sub-row"><div class="sub-info"><div class="st">В этапе (без подэтапа)</div></div>'+
            '<div class="docs">'+s.documents.map(docCard).join('')+'</div></div>';
    }
    html+='<section class="stage"><header class="stage-head"><div class="stage-n">'+(i+1)+'</div>'+
          '<div><div class="tt">'+esc(s.title)+'</div><div class="dd">'+esc(s.description||'')+'</div></div>'+
          '<span class="stage-count">'+countDocs(s)+' док.</span></header>'+
          (rows||'<div class="sub-row"><div class="empty">нет подэтапов</div></div>')+'</section>';
  });
  if((b.unassigned||[]).length){
    html+='<section class="stage unassigned"><header class="stage-head"><div class="stage-n">?</div>'+
          '<div><div class="tt">Без уверенной привязки</div><div class="dd">Загружены, но алгоритм не отнёс к этапу — нужна проверка человека</div></div>'+
          '<span class="stage-count">'+b.unassigned.length+' док.</span></header>'+
          '<div class="sub-row"><div class="sub-info"><div class="st">Требует решения</div></div>'+
          '<div class="docs">'+b.unassigned.map(docCard).join('')+'</div></div></section>';
  }
  document.getElementById('board').innerHTML=html||'<div class="msg">Пока нет ни этапов, ни документов.</div>';
}
function countDocs(s){var n=(s.documents||[]).length;(s.substages||[]).forEach(function(x){n+=x.documents.length;});return n;}
function stat(v,label,warn){return '<div class="stat'+(warn?' warn':'')+'"><b>'+(v||0)+'</b><span>'+label+'</span></div>';}
function load(){
  document.getElementById('board').innerHTML='<div class="msg">Загрузка…</div>';
  fetch('/documents/board',{credentials:'same-origin'}).then(function(r){
    if(r.status===401){location.href='/login';return null;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(b){if(b)render(b);}).catch(function(e){
    document.getElementById('board').innerHTML='<div class="msg">Не удалось загрузить данные: '+esc(e.message)+'</div>';
  });
}
document.getElementById('reload').addEventListener('click',load);
load();
</script>
</body>
</html>
