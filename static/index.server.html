<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG-ассистент по регламентам</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #f5f7fa;
        }
        h1 {
            color: #1e293b;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 10px;
        }
        h2.section-title {
            color: #1e293b;
            font-size: 20px;
            margin-top: 40px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        #question-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }
        #ask-btn, .primary-btn {
            padding: 12px 28px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #ask-btn:hover, .primary-btn:hover {
            background: #2563eb;
        }
        #ask-btn:disabled, .primary-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin: 16px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h3 {
            margin-top: 0;
            color: #0f172a;
            display: flex;
            justify-content: space-between;
        }
        .badge {
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: normal;
        }
        .badge.escalate { background: #fecaca; color: #991b1b; }
        .badge.rag { background: #bbf7d0; color: #14532d; }
        .badge.scenario { background: #fde68a; color: #78350f; }
        .badge.general { background: #dbeafe; color: #1e40af; }
        .candidate {
            border-left: 4px solid #94a3b8;
            padding-left: 12px;
            margin: 10px 0;
        }
        .candidate.relevant {
            border-left-color: #22c55e;
            background: #f0fdf4;
        }
        .candidate .score {
            font-weight: bold;
            margin-right: 8px;
        }
        .candidate .text {
            color: #1e293b;
        }
        .answer {
            background: #eef2ff;
            padding: 16px;
            border-radius: 8px;
            border-left: 6px solid #3b82f6;
            white-space: pre-wrap;
        }
        .time {
            color: #64748b;
            font-size: 14px;
            margin-top: 8px;
        }
        .error {
            color: #dc2626;
            background: #fee2e2;
            padding: 12px;
            border-radius: 8px;
        }
        #history {
            margin-top: 30px;
        }
        .history-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 0;
        }
        .history-item .q {
            font-weight: 600;
        }
        .history-item .a {
            color: #1e293b;
            margin-top: 4px;
        }

        /* ---- Панель документов ---- */
        .dropzone {
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: 0.15s;
            color: #475569;
        }
        .dropzone.dragover {
            border-color: #3b82f6;
            background: #eff6ff;
            color: #1e40af;
        }
        .dropzone small {
            display: block;
            margin-top: 6px;
            color: #94a3b8;
        }
        #file-input { display: none; }

        .doc-list {
            margin-top: 16px;
        }
        .doc-item {
            background: white;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .doc-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .doc-name {
            font-weight: 600;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .doc-meta {
            font-size: 13px;
            color: #64748b;
        }
        .doc-status {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
        }
        .status-badge.uploaded { background: #e2e8f0; color: #475569; }
        .status-badge.processing { background: #fde68a; color: #78350f; }
        .status-badge.indexed { background: #bbf7d0; color: #14532d; }
        .status-badge.error { background: #fecaca; color: #991b1b; }
        .del-btn {
            background: none;
            border: 1px solid #fca5a5;
            color: #dc2626;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 13px;
        }
        .del-btn:hover { background: #fee2e2; }
        .empty-hint {
            color: #94a3b8;
            font-size: 14px;
            padding: 10px 0;
        }
        .upload-progress {
            margin-top: 12px;
            font-size: 14px;
            color: #1e40af;
        }

        /* ---- Контекст диалога ---- */
        .context-note {
            background: #f5f3ff;
            border-left: 4px solid #8b5cf6;
            color: #5b21b6;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 12px;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .new-dialog-btn {
            background: none;
            border: 1px solid #cbd5e1;
            color: #475569;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }
        .new-dialog-btn:hover {
            background: #f1f5f9;
        }
    </style>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="app-page">
    <h1>🧠 RAG-ассистент по регламентам</h1>

    <!-- ==================== ПАНЕЛЬ ДОКУМЕНТОВ ==================== -->
    <h2 class="section-title">📁 База регламентов</h2>

    <div class="dropzone" id="dropzone">
        <div>⬆️ Перетащите PDF или DOCX сюда, или нажмите, чтобы выбрать файл</div>
        <small>Поддерживаются: PDF, DOCX, DOC, PPTX, HTML, MD, TXT · до 50 МБ</small>
        <input type="file" id="file-input" accept=".pdf,.docx,.doc,.pptx,.html,.htm,.md,.txt" />
    </div>
    <div class="upload-progress" id="upload-progress"></div>

    <div class="doc-list" id="doc-list">
        <div class="empty-hint">Загрузка списка документов...</div>
    </div>

    <!-- ==================== ПАНЕЛЬ ВОПРОСОВ ==================== -->
    <div class="chat-header">
        <h2 class="section-title">💬 Задать вопрос</h2>
        <button class="new-dialog-btn" onclick="startNewDialog()" title="Забыть историю текущего диалога">🔄 Новый диалог</button>
    </div>
    <div class="input-area">
        <input type="text" id="question-input" placeholder="Введите вопрос..." />
        <button id="ask-btn" onclick="ask()">Отправить</button>
    </div>
    <div id="result"></div>
    <div id="history">
        <h3>📋 История</h3>
        <div id="history-list"></div>
    </div>

    <script>
        // ---------------- Вопросы к RAG ----------------
        const resultDiv = document.getElementById('result');
        const historyList = document.getElementById('history-list');
        const input = document.getElementById('question-input');
        const btn = document.getElementById('ask-btn');

        // session_id связывает подряд идущие вопросы в один диалог — по нему сервер
        // помнит последние HISTORY_WINDOW вопросов и умеет разрешать контекстные
        // формулировки вроде "Где взять" на основе того, о чём спрашивали раньше.
        // Хранится в переменной страницы (не в localStorage/sessionStorage): диалог
        // живёt, пока открыта вкладка, и начинается заново при перезагрузке страницы.
        let ragSessionId = null;

        function getSessionId() {
            if (!ragSessionId) {
                ragSessionId = (crypto.randomUUID ? crypto.randomUUID() : `sid-${Date.now()}-${Math.random().toString(16).slice(2)}`);
            }
            return ragSessionId;
        }

        function startNewDialog() {
            if (ragSessionId) {
                fetch(`/session/${encodeURIComponent(ragSessionId)}`, { method: 'DELETE' }).catch(() => {});
            }
            ragSessionId = null;
            historyList.innerHTML = '';
            resultDiv.innerHTML = '';
            input.focus();
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') ask();
        });

        function ask() {
            const question = input.value.trim();
            if (!question) return;
            btn.disabled = true;
            resultDiv.innerHTML = '⏳ Обработка...';
            input.value = '';

            fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, session_id: getSessionId() })
            })
            .then(res => res.json())
            .then(data => {
                if (data.session_id) ragSessionId = data.session_id;
                renderResult(data);
                addHistory(data);
                btn.disabled = false;
            })
            .catch(err => {
                resultDiv.innerHTML = `<div class="error">Ошибка: ${err.message}</div>`;
                btn.disabled = false;
            });
        }

        function renderResult(data) {
            if (data.error) {
                resultDiv.innerHTML = `<div class="error">❌ ${escapeHtml(data.error)}</div>`;
                return;
            }

            let html = `<div class="card"><h3>📌 ${escapeHtml(data.question)}</h3>`;

            if (data.context_used && data.resolved_question) {
                html += `<div class="context-note">🔗 Понято с учётом предыдущих вопросов как: «${escapeHtml(data.resolved_question)}»</div>`;
            }

            const cls = data.classification;
            const route = data.route || 'unknown';
            const badgeClass = route === 'escalate' ? 'escalate' : route === 'rag' ? 'rag' : route === 'general' ? 'general' : 'scenario';
            html += `<div><span class="badge ${badgeClass}">${route}</span>`;
            if (cls.risk_flag) {
                html += ` <span class="badge" style="background:#fca5a5;">⚠️ ${cls.risk_type || 'риск'}</span>`;
            }
            html += `</div>`;

            if (data.topics_used && data.topics_used.length) {
                html += `<div class="doc-meta" style="margin-top:8px;">🗂️ Искал в темах: ${data.topics_used.map(escapeHtml).join(', ')}</div>`;
            }

            if (data.answer) {
                html += `<div style="margin-top:16px;"><strong>🤖 Ответ:</strong>
                    <div class="answer">${escapeHtml(data.answer)}</div>
                </div>`;
            } else {
                if (route === 'general') {
                    html += `<p style="margin-top:12px;">Обработано как общее приветствие. (Ответ не сгенерирован)</p>`;
                } else if (route === 'escalate') {
                    html += `<p style="margin-top:12px;">⚠️ Маршрут <strong>эскалация</strong> — запрос передан специалисту.</p>`;
                } else if (route === 'scenario') {
                    html += `<p style="margin-top:12px;">📘 Учебный сценарий — обработка в отдельном модуле.</p>`;
                } else if (route === 'rag') {
                    if (data.top_fragments && data.top_fragments.length === 0) {
                        html += `<div style="margin-top:16px;color:#64748b;">⚠️ Недостаточно уверенности для генерации (confidence gate).</div>`;
                    } else {
                        html += `<p style="margin-top:12px;">Поиск не дал релевантных фрагментов.</p>`;
                    }
                } else {
                    html += `<p style="margin-top:12px;">Неизвестный маршрут.</p>`;
                }
            }

            if (route === 'rag' && data.candidates && data.candidates.length) {
                html += `<div style="margin-top:12px;"><strong>🔍 Найденные фрагменты:</strong>`;
                data.candidates.forEach((c, i) => {
                    const isTop = i < data.top_fragments.length;
                    html += `<div class="candidate ${isTop ? 'relevant' : ''}">
                        <div><span class="score">${c.relevance.toFixed(2)}</span> 
                        (vector: ${c.vector_score.toFixed(3)})</div>
                        <div class="text">${escapeHtml(c.text)}</div>
                    </div>`;
                });
                html += `</div>`;
            }

            html += `<div class="time">⏱️ Время: ${data.elapsed_time.toFixed(2)} сек</div>`;
            html += `</div>`;
            resultDiv.innerHTML = html;
        }

        function addHistory(data) {
            const entry = document.createElement('div');
            entry.className = 'history-item';
            const answerText = data.answer || (data.route === 'escalate' ? '⚡ Эскалация' : '❌ Нет ответа');
            const contextTag = data.context_used ? ' • 🔗 с учётом контекста' : '';
            entry.innerHTML = `
                <div class="q">❓ ${escapeHtml(data.question)}</div>
                <div class="a">${escapeHtml(answerText)}</div>
                <div style="font-size:12px;color:#94a3b8;">${data.elapsed_time.toFixed(2)} сек • ${data.route || 'unknown'}${contextTag}</div>
            `;
            historyList.prepend(entry);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // ---------------- Управление документами ----------------
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const docList = document.getElementById('doc-list');
        const uploadProgress = document.getElementById('upload-progress');

        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) uploadFile(fileInput.files[0]);
        });

        ['dragenter', 'dragover'].forEach(evt => {
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });
        });
        ['dragleave', 'drop'].forEach(evt => {
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            });
        });
        dropzone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length) uploadFile(files[0]);
        });

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            uploadProgress.textContent = `⏳ Загрузка и обработка через docling: ${file.name}...`;

            fetch('/documents/upload', { method: 'POST', body: formData })
                .then(res => res.json().then(data => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (ok) {
                        uploadProgress.textContent = `✅ ${file.name}: проиндексировано ${data.chunks} чанков за ${data.elapsed.toFixed(2)} сек`;
                    } else {
                        uploadProgress.textContent = `❌ Ошибка обработки ${file.name}: ${data.error || data.detail}`;
                    }
                    fileInput.value = '';
                    loadDocuments();
                })
                .catch(err => {
                    uploadProgress.textContent = `❌ Ошибка загрузки: ${err.message}`;
                });
        }

        function statusLabel(status) {
            switch (status) {
                case 'uploaded': return 'Загружен';
                case 'processing': return 'Обрабатывается (docling)...';
                case 'indexed': return 'Готов к поиску';
                case 'error': return 'Ошибка';
                default: return status;
            }
        }

        function formatSize(bytes) {
            if (!bytes && bytes !== 0) return '';
            const kb = bytes / 1024;
            if (kb < 1024) return `${kb.toFixed(0)} КБ`;
            return `${(kb / 1024).toFixed(1)} МБ`;
        }

        function loadDocuments() {
            fetch('/documents')
                .then(res => res.json())
                .then(data => renderDocuments(data.documents || []))
                .catch(() => {
                    docList.innerHTML = `<div class="empty-hint">Не удалось загрузить список документов.</div>`;
                });
        }

        function renderDocuments(docs) {
            if (!docs.length) {
                docList.innerHTML = `<div class="empty-hint">Пока нет загруженных документов — добавьте первый регламент выше.</div>`;
                return;
            }
            docList.innerHTML = docs.map(doc => {
                const meta = [
                    doc.size_bytes !== undefined ? formatSize(doc.size_bytes) : null,
                    doc.chunks ? `${doc.chunks} чанков` : null,
                    doc.uploaded_at ? doc.uploaded_at.replace('T', ' ') : null,
                ].filter(Boolean).join(' · ');
                const errorLine = doc.status === 'error' && doc.error
                    ? `<div class="doc-meta" style="color:#dc2626;">${escapeHtml(doc.error)}</div>` : '';
                const topicBadge = doc.topic_name
                    ? `<span class="badge" style="background:#e0e7ff;color:#3730a3;">🗂️ ${escapeHtml(doc.topic_name)}</span>` : '';
                return `
                    <div class="doc-item" data-filename="${escapeHtml(doc.filename)}">
                        <div class="doc-info">
                            <div class="doc-name" title="${escapeHtml(doc.filename)}">📄 ${escapeHtml(doc.filename)} ${topicBadge}</div>
                            <div class="doc-meta">${meta}</div>
                            ${errorLine}
                        </div>
                        <div class="doc-status">
                            <span class="status-badge ${doc.status}">${statusLabel(doc.status)}</span>
                            <button class="del-btn" onclick="deleteDocument('${escapeHtml(doc.filename)}')">Удалить</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteDocument(filename) {
            if (!confirm(`Удалить документ "${filename}" и все его данные из индекса?`)) return;
            fetch(`/documents/${encodeURIComponent(filename)}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => loadDocuments())
                .catch(err => alert(`Ошибка удаления: ${err.message}`));
        }

        // Первичная загрузка списка + периодическое обновление статусов "processing"
        loadDocuments();
        setInterval(loadDocuments, 4000);
    </script>
</body>
</html>
